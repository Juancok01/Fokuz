name: Pruebas

# Verifica tipos, corre las pruebas automáticas y el build en cada push y pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos y accesibilidad (svelte-check)
        run: npm run check -- --fail-on-warnings

      - name: Pruebas (rachas, fechas, saldos, notas, Pomodoro)
        run: npm test

      - name: Build
        run: npm run build
